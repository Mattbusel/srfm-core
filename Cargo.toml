[package]
name = "srfm-core"
version = "0.1.2"
edition = "2021"
rust-version = "1.81"
description = "If your indicator has two implementations and no shared test vectors, you have two indicators. SRFM bar transforms (Minkowski beta, black-hole mass, rolling geodesic, Hawking z) checked against the same golden vectors as the Python package. No default dependencies; optional ta::Next."
authors = ["Matthew Busel"]
license = "MIT"
repository = "https://github.com/Mattbusel/srfm-core"
documentation = "https://docs.rs/srfm-core"
readme = "README.md"
keywords = ["trading", "indicators", "golden-vectors", "quant", "technical-analysis"]
categories = ["finance", "mathematics", "algorithms"]
include = [
    "/src/**/*",
    "/tests/**/*",
    "/examples/*.rs",
    "/golden/golden_vectors.json",
    "/docs/**/*",
    "/Cargo.toml",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
    "/README.md",
]

[features]
default = []
## `ta::Next` / `ta::Reset` impls so the streaming structs drop into code built on the `ta` crate.
ta = ["dep:ta"]

[dependencies]
ta = { version = "0.5", optional = true, default-features = false }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "ta_next"
required-features = ["ta"]

[package.metadata.docs.rs]
all-features = true

[workspace]
members = [".", "bindings/python-rs"]
