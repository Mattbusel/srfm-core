[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "srfm-core"
version = "0.1.1"
description = "SRFM bar transforms (Minkowski beta, black-hole mass, geodesic, Hawking z) as numpy/pandas functions, streaming classes, a vectorbt indicator and a freqtrade helper. Carved out of srfm-lab, with golden vectors shared with the Rust crate."
readme = "PYPI.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Matthew Busel" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "pandas>=1.4"]
keywords = ["trading", "technical-analysis", "indicators", "quant", "finance", "vectorbt", "freqtrade", "srfm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
vbt = ["vectorbt>=0.25"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Mattbusel/srfm-core"
Source = "https://github.com/Mattbusel/srfm-core"
Documentation = "https://github.com/Mattbusel/srfm-core/tree/main/docs"
Changelog = "https://github.com/Mattbusel/srfm-core/blob/main/CHANGELOG.md"
Issues = "https://github.com/Mattbusel/srfm-core/issues"
"Upstream (srfm-lab)" = "https://github.com/Mattbusel/srfm-lab"

[tool.hatch.build.targets.wheel]
packages = ["srfm_core"]

[tool.hatch.build.targets.sdist]
include = ["srfm_core", "tests", "PYPI.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
