name: Publish to PyPI

# Trusted publishing: the PyPI project srfm-core trusts
# repo Mattbusel/srfm-core, workflow publish.yml, environment pypi.
on:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag matches package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          test "py-v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != py-v$v"; exit 1; }
      - run: pip install build twine numpy pandas pytest
      - run: pip install ./python && pytest -q python/tests
      - run: python -m build python
      - run: twine check python/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/srfm-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
