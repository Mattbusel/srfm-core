[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "srfm-core-rs"
version = "0.1.0"
description = "Optional Rust accelerator for srfm-core (built from the srfm-core crate). Not published yet."
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
features = ["pyo3/extension-module"]
